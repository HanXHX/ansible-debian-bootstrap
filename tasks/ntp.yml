---

- name: ASSERT | validated package
  ansible.builtin.assert:
    that: 'dbs_ntp_pkg == "openntpd" or dbs_ntp_pkg == "ntp" or dbs_ntp_pkg == "chrony"'

- name: APT | Install NTP daemon
  ansible.builtin.apt:
    pkg: "{{ dbs_ntp_pkg }}"
    state: present

- name: TEMPLATE | Deploy OpenNTPd configuration file
  ansible.builtin.template:
    src: etc/openntpd/ntpd.conf.j2
    dest: /etc/openntpd/ntpd.conf
    mode: 0644
    owner: root
    group: root
  notify: restart openntpd
  when: dbs_ntp_pkg == 'openntpd'

- name: TEMPLATE | Deploy NTPd configuration file
  ansible.builtin.template:
    src: etc/ntp.conf.j2
    dest: /etc/ntp.conf
    mode: 0644
    owner: root
    group: root
  notify: restart ntp
  when: dbs_ntp_pkg == 'ntp'

- name: BLOCK | Setup Chrony
  when: dbs_ntp_pkg == 'chrony'
  block:
    - name: TEMPLATE | Deploy Chrony configuration file
      ansible.builtin.template:
        src: etc/chrony/sources.d/__tpl.sources.j2
        dest: /etc/chrony/sources.d/default.sources
        mode: 0644
        owner: root
        group: root
      notify: Reload chrony sources

    - name: SERVICE | Ensure Chrony is started and enabled
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true
